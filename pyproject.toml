[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aodsl"
version = "1.0.0"
description = "Deterministic orchestration DSL and control plane"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest==9.1.1"]

[project.scripts]
aodsl = "aodsl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["aodsl*"]
