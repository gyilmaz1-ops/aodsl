services:
  postgres:
    image: postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
    environment:
      POSTGRES_USER: aodsl
      POSTGRES_PASSWORD: aodsl_cert
      POSTGRES_DB: aodsl_cert
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aodsl -d aodsl_cert"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "55432:5432"
