name: AODSL Production Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  production-gate:
    name: Certified Production Build
    # The GitHub runner is bootstrap infrastructure only.
    # All certified build/release commands execute inside the
    # digest-pinned INV-054 environment below.
    runs-on: ubuntu-latest
    container:
      image: python@sha256:47ae396f09c1303b8653019811a8498470603d7ffefc29cb07c88f1f8cb3d19f
    timeout-minutes: 15
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Verify certified build environment
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tools/verify_build_environment.py

      - name: Install hash-locked build and test toolchain
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/build.lock

      - name: Install hash-locked production dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/production.lock

      - name: Install AODSL without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify hash-locked production dependencies
        run: python tools/verify_production_dependencies.py

      - name: Verify production attestation
        run: python tools/verify_production_attestation.py

      - name: Build only through production gate
        run: python tools/release_gate.py --production

      - name: Create deterministic SBOM
        run: python tools/create_sbom.py

      - name: Verify deterministic SBOM
        run: python tools/verify_sbom.py

      - name: Create certified release identity
        run: python tools/create_release_identity.py

      - name: Verify certified release identity
        run: python tools/verify_release_identity.py

      - name: Generate signed build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/aodsl-*-production-source.zip'

      - name: Generate signed SBOM provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist/aodsl-*.cdx.json'

      - name: Upload certified artifact
        uses: actions/upload-artifact@v4
        with:
          name: aodsl-certified-production
          path: |
            dist/aodsl-*-production-source.zip
            dist/aodsl-*.cdx.json
            dist/release-manifest.json
            dist/certified-release-identity.json
            certification/production-certification-manifest.json
            certification/production-certification-attestation.json
            certification/evidence/live-certification-status.json
          if-no-files-found: error
          retention-days: 90
