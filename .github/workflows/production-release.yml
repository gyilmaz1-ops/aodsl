name: AODSL Production Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  reproducible-build:
    permissions:
      contents: read
      packages: read
    name: Reproducible Build ${{ matrix.build }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gyilmaz1-ops/aodsl-build-git@sha256:0574165e4b162022d2f6b79528f07d2780f99bb4105ae996128c6530dedb7597
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build: [a, b]

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Configure workspace Git trust
        run: |
          python - <<'CHECK'
          import os
          from pathlib import Path
          import subprocess

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert workspace == Path.cwd().resolve()
          subprocess.run([
              "/usr/bin/git", "config", "--global", "--add",
              "safe.directory", str(workspace),
          ], check=True)
          print("WORKSPACE_GIT_TRUST: PASS")
          CHECK

      - name: Verify release source reference
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tools/verify_release_source_ref.py

      - name: Resolve authoritative release artifact names
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PYVERSION'
          import os
          from pathlib import Path
          from aodsl.certification.version_policy import (
              read_project_version,
              artifact_names,
          )

          version = read_project_version(Path("pyproject.toml"))
          artifact, sbom = artifact_names(version)

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"AODSL_ARTIFACT={artifact}\n")
              output.write(f"AODSL_SBOM={sbom}\n")
          PYVERSION

      - name: Verify certified build environment
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tools/verify_build_environment.py

      - name: Install hash-locked build and test toolchain
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/build.lock

      - name: Install hash-locked production dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/production.lock

      - name: Install AODSL without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify hash-locked production dependencies
        run: python tools/verify_production_dependencies.py

      - name: Verify production attestation
        run: python tools/verify_production_attestation.py

      - name: Build only through production gate
        run: python tools/release_gate.py --production

      - name: Create deterministic SBOM
        run: python tools/create_sbom.py

      - name: Verify deterministic SBOM
        run: python tools/verify_sbom.py

      - name: Stage reproducibility candidate
        run: |
          mkdir -p repro-output
          cp dist/${AODSL_ARTIFACT} repro-output/
          cp dist/${AODSL_SBOM} repro-output/
          cp dist/release-manifest.json repro-output/

      - name: Upload reproducibility candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aodsl-repro-${{ matrix.build }}
          path: repro-output/
          if-no-files-found: error
          retention-days: 1

  production-gate:
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: read
    name: Certified Production Promotion
    needs: reproducible-build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/gyilmaz1-ops/aodsl-build-git@sha256:0574165e4b162022d2f6b79528f07d2780f99bb4105ae996128c6530dedb7597
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 15

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Configure workspace Git trust
        run: |
          python - <<'CHECK'
          import os
          from pathlib import Path
          import subprocess

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert workspace == Path.cwd().resolve()
          subprocess.run([
              "/usr/bin/git", "config", "--global", "--add",
              "safe.directory", str(workspace),
          ], check=True)
          print("WORKSPACE_GIT_TRUST: PASS")
          CHECK

      - name: Verify release source reference
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tools/verify_release_source_ref.py

      - name: Resolve authoritative release artifact names
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PYVERSION'
          import os
          from pathlib import Path
          from aodsl.certification.version_policy import (
              read_project_version,
              artifact_names,
          )

          version = read_project_version(Path("pyproject.toml"))
          artifact, sbom = artifact_names(version)

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"AODSL_ARTIFACT={artifact}\n")
              output.write(f"AODSL_SBOM={sbom}\n")
          PYVERSION

      - name: Verify certified build environment
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tools/verify_build_environment.py

      - name: Install hash-locked build and test toolchain
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/build.lock

      - name: Install hash-locked production dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r requirements/production.lock

      - name: Install AODSL without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify hash-locked production dependencies
        run: python tools/verify_production_dependencies.py

      - name: Download reproducibility candidate A
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aodsl-repro-a
          path: repro/a

      - name: Download reproducibility candidate B
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aodsl-repro-b
          path: repro/b

      - name: Compare independent release artifacts
        run: >
          python tools/verify_reproducible_artifacts.py
          repro/a repro/b
          --output dist/reproducibility-manifest.json

      - name: Promote exact verified candidate A
        run: |
          cp repro/a/${AODSL_ARTIFACT} dist/
          cp repro/a/${AODSL_SBOM} dist/
          cp repro/a/release-manifest.json dist/

      - name: Verify promoted deterministic SBOM
        run: python tools/verify_sbom.py

      - name: Stage exact certified bundle payload
        run: |
          rm -rf dist/certified-bundle-stage
          mkdir -p dist/certified-bundle-stage/dist
          mkdir -p dist/certified-bundle-stage/certification/evidence
          cp dist/${AODSL_ARTIFACT} dist/certified-bundle-stage/dist/${AODSL_ARTIFACT}
          cp dist/${AODSL_SBOM} dist/certified-bundle-stage/dist/${AODSL_SBOM}
          cp dist/release-manifest.json dist/certified-bundle-stage/dist/release-manifest.json
          cp dist/reproducibility-manifest.json dist/certified-bundle-stage/dist/reproducibility-manifest.json
          cp certification/production-certification-manifest.json dist/certified-bundle-stage/certification/production-certification-manifest.json
          cp certification/production-certification-attestation.json dist/certified-bundle-stage/certification/production-certification-attestation.json
          cp certification/evidence/live-certification-status.json dist/certified-bundle-stage/certification/evidence/live-certification-status.json

      - name: Create physical certified bundle manifest
        run: >
          python tools/create_certified_bundle_manifest.py
          --bundle-root dist/certified-bundle-stage

      - name: Verify physical certified bundle closure
        run: >
          python tools/verify_certified_bundle_manifest.py
          --bundle-root dist/certified-bundle-stage

      - name: Promote verified certified bundle manifest
        run: |
          cp dist/certified-bundle-stage/dist/certified-bundle-manifest.json dist/certified-bundle-manifest.json
          cmp dist/certified-bundle-stage/dist/certified-bundle-manifest.json dist/certified-bundle-manifest.json

      - name: Create certified release identity
        run: python tools/create_release_identity.py

      - name: Verify certified release identity
        run: python tools/verify_release_identity.py

      - name: Generate signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: 'dist/${{ env.AODSL_ARTIFACT }}'

      - name: Generate signed SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: 'dist/${{ env.AODSL_SBOM }}'

      - name: Upload certified artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aodsl-certified-production
          path: |
            dist/${{ env.AODSL_ARTIFACT }}
            dist/${{ env.AODSL_SBOM }}
            dist/release-manifest.json
            dist/reproducibility-manifest.json
            dist/certified-bundle-manifest.json
            dist/certified-release-identity.json
            certification/production-certification-manifest.json
            certification/production-certification-attestation.json
            certification/evidence/live-certification-status.json
          if-no-files-found: error
          retention-days: 90
