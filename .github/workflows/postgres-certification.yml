name: AODSL PostgreSQL Certification
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  certify-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: aodsl
          POSTGRES_PASSWORD: aodsl_cert
          POSTGRES_DB: aodsl_cert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aodsl -d aodsl_cert"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      AODSL_POSTGRES_DSN: postgresql://aodsl:aodsl_cert@127.0.0.1:5432/aodsl_cert
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install -e ".[postgres,test]"
      - run: python tools/run_live_postgres_certification.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aodsl-live-certification-status
          path: dist/live-certification-status.json
