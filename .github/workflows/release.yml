name: AODSL v1 Release Gate
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python tools/architecture_freeze_gate.py
      - run: python tools/release_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: aodsl-release-candidate
          path: dist/
